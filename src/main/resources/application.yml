server:
  port: 8080

spring:
  liquibase:
    drop-first: false
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s
        pool:
          type: ELASTIC
          max-idle-time: 15s
          idle-timeout: 15s
          max-life-time: 45s
      routes:
        # USER SERVICE ROUTES
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/user/**
          filters:
            - RewritePath=/user/(?<segment>.*),/${segment}

        # CORE SERVICE ROUTES  
        - id: core-service
          uri: ${CORE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/core/**
          filters:
            - RewritePath=/core/(?<segment>.*),/${segment}

        # PAYMENT SERVICE ROUTES
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/payment/**
          filters:
            - RewritePath=/payment/(?<segment>.*),/${segment}

        # ZONING SERVICE ROUTES
        - id: zoning-service
          uri: ${ZONING_SERVICE_URL:http://localhost:8000}
          predicates:
            - Path=/zoning/**
          filters:
            - RewritePath=/zoning/(?<segment>.*),/${segment}
          metadata:
            # Overrides the global 30s httpclient response-timeout for this
            # route only. Uploading a by-law PDF means streaming up to 50 MB
            # through the gateway, writing it to S3 and counting its pages —
            # comfortably past 30s on an ordinary connection. A 52 MB upload
            # returned 504 here while the same file sent straight to
            # zoning.landgo.ca reached the service and got the app's own
            # "File exceeds 50MB limit". The documented 50 MB limit could not
            # be reached through the gateway at all.
            #
            # 300s so the binding constraint is the service's 50 MB cap rather
            # than a proxy timeout, which fails opaquely as a 504 with no clue
            # about size.
            response-timeout: 300000
            connect-timeout: 5000

        # HEALTH CHECK
        - id: api-ping
          uri: http://localhost:8080
          predicates:
            - Path=/api/ping
          filters:
            - RewritePath=/api/ping, /actuator/health

        # SERVICE DOCS (Optional - keep for backward compatibility during transition)
        - id: user-service-docs
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/user-service/v3/api-docs/**
          filters:
            - RewritePath=/user-service/(?<segment>.*), /${segment}

        - id: core-service-docs
          uri: ${CORE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/core-service/v3/api-docs/**
          filters:
            - RewritePath=/core-service/(?<segment>.*), /${segment}

        - id: payment-service-docs
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/payment-service/v3/api-docs/**
          filters:
            - RewritePath=/payment-service/(?<segment>.*), /${segment}

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_FIRST

app:
  jwt:
    secret: ${JWT_SECRET:myVeryLongSecretKeyThatIsAtLeast256BitsForHS256Algorithm2024!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    root: INFO
    com.landgo.gateway: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.http.server.reactive: INFO
    org.springframework.web.reactive: INFO